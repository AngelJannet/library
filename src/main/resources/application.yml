spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/library
    username: library_admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080

logging:
  level:
    org:
      springframework:
        security: DEBUG
